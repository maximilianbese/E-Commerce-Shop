<article class="h-full flex flex-col bg-surface rounded-2xl overflow-hidden">
  <a routerLink="/produkt/{{ product().id }}">
    <img [src]="product().imageUrl" [alt]="product().name" class="w-full aspect-5/6 object-cover" />
  </a>

  <div class="flex-1 p-3 sm:p-5 flex flex-col gap-2">
    <a routerLink="/produkt/{{ product().id }}"
      ><h2 class="hyphens-auto break-words text-lg sm:text-2xl font-heading text-brand-dark font-semibold">{{ product().name }}</h2></a
    >

    @if (product().price !== null) {
      <p class="mt-auto font-semibold text-base sm:text-lg">{{ product().price | currency: 'EUR' }}</p>
      <app-button (click)="addToCart()">In den Warenkorb</app-button>
    } @else {
      <p class="mt-auto font-semibold text-base sm:text-lg">Preis auf Anfrage</p>
    }
  </div>
</article>
