<main class="p-5 max-w-6xl mx-auto">
  @if (product(); as product) {
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-10">
      <img [src]="product.imageUrl" [alt]="product.name" class="w-full rounded-2xl" />
      <div class="flex flex-col gap-4">
        <h1 class="text-4xl font-heading text-brand-dark font-semibold">{{ product.name }}</h1>
        @if (product.price !== null) {
          <p class="text-2xl font-bold">{{ product.price | currency: 'EUR' }}</p>
          <app-button (click)="addToCart(product)">In den Warenkorb</app-button>
        } @else {
          <p class="text-2xl font-bold">Preis auf Anfrage</p>
        }
      </div>
    </div>
  } @else {
    <p>Produkt nicht gefunden.</p>
  }
</main>
