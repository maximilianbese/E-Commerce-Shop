<main class="p-5 max-w-xl mx-auto">
  <h1 class="text-3xl sm:text-4xl font-heading text-brand-dark font-semibold">Kasse</h1>

  @if (ordered()) {
    <p class="py-5 text-xl">Danke für deine Bestellung! 🎉</p>
    <a routerLink="/shop" class="text-brand hover:text-brand-dark font-bold">← Weiter einkaufen</a>
  } @else if (cartService.count() === 0) {
    <p class="py-5">Dein Warenkorb ist leer.</p>
    <a routerLink="/shop" class="text-brand hover:text-brand-dark font-bold">← Zum Shop</a>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 py-5">
      <label class="flex flex-col gap-1">
        Name
        <input formControlName="name" autocomplete="name" class="border-2 border-surface rounded-lg p-2" />
        @if (form.controls.name.invalid && form.controls.name.touched) {
          <span class="text-sm text-red-700">Bitte gib deinen Namen ein.</span>
        }
      </label>

      <label class="flex flex-col gap-1">
        E-Mail
        <input formControlName="email" type="email" autocomplete="email" class="border-2 border-surface rounded-lg p-2" />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="text-sm text-red-700">Bitte gib eine gültige E-Mail-Adresse ein.</span>
        }
      </label>

      <label class="flex flex-col gap-1">
        Straße und Hausnummer
        <input formControlName="street" autocomplete="street-address" class="border-2 border-surface rounded-lg p-2" />
        @if (form.controls.street.invalid && form.controls.street.touched) {
          <span class="text-sm text-red-700">Bitte gib deine Straße ein.</span>
        }
      </label>

      <div class="grid grid-cols-[2fr_3fr] gap-4">
        <label class="flex flex-col gap-1">
          PLZ
          <input formControlName="zip" inputmode="numeric" autocomplete="postal-code" class="w-full border-2 border-surface rounded-lg p-2" />
          @if (form.controls.zip.invalid && form.controls.zip.touched) {
            <span class="text-sm text-red-700">Bitte 5 Ziffern.</span>
          }
        </label>

        <label class="flex flex-col gap-1">
          Ort
          <input formControlName="city" autocomplete="address-level2" class="w-full border-2 border-surface rounded-lg p-2" />
          @if (form.controls.city.invalid && form.controls.city.touched) {
            <span class="text-sm text-red-700">Bitte gib deinen Ort ein.</span>
          }
        </label>
      </div>

      <p class="flex justify-between font-bold text-xl border-t border-surface pt-4">
        <span>Zu zahlen ({{ cartService.count() }} Artikel)</span>
        <span>{{ cartService.total() | currency: 'EUR' }}</span>
      </p>

      <app-button fullWidth>Bestellung absenden</app-button>
    </form>
  }
</main>
