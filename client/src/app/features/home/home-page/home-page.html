<main>
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-10 items-center max-w-6xl mx-auto p-5 py-10">
    <div class="flex flex-col gap-6 items-center text-center lg:items-start lg:text-left">
      <h1 class="text-4xl sm:text-6xl font-heading text-brand-dark font-semibold">
        Handgemachte Deko für dein Zuhause
      </h1>
      <p class="text-lg">
        Kerzen, Raysin-Deko und Geschenke mit persönlicher Note, mit Liebe von Hand gemacht.
      </p>
      <a
        routerLink="/shop"
        class="w-fit bg-brand hover:bg-brand-dark text-white font-bold py-3 px-6 rounded-lg text-lg"
      >
        Jetzt stöbern
      </a>
    </div>
    <img
      src="/images/stimmungsbilder/esstisch-gedeckt.webp"
      alt="Gedeckter Esstisch mit handgemachter Deko"
      class="w-full max-h-[75vh] object-cover rounded-2xl"
    />
  </section>

  <section class="max-w-6xl mx-auto p-5 py-10">
    <h2 class="text-3xl font-heading text-brand-dark font-semibold">Unsere Kategorien</h2>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-5">
      @for (tile of categories; track tile.label) {
        <a
          routerLink="/shop"
          [queryParams]="{ kategorie: tile.value }"
          class="bg-surface rounded-2xl overflow-hidden"
        >
          <img [src]="tile.imageUrl" [alt]="tile.label" class="w-full aspect-square object-cover" />
          <p class="p-5 text-2xl font-heading text-brand-dark font-semibold">{{ tile.label }}</p>
        </a>
      }
    </div>
  </section>
</main>
